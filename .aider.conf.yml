# Primary & Commit Models (Zero-Cost OpenRouter Stack)
model: openrouter/poolside/laguna-s-2.1:free
weak-model: openrouter/cohere/north-mini-code:free

# Global Fallback & Zero-Cost Metadata Links
model-settings-file: ~/.aider.model.settings.yml
model-metadata-file: ~/.aider.model.metadata.json

# Fully autonomous execution
yes-always: true
auto-commits: true
auto-test: true
auto-lint: true

# Verification commands
test-cmd: npm test
lint-cmd: npm run build

# Language enforcement (English only)
commit-prompt: "Write a concise, imperative git commit message in English describing the changes. Do not use any other language."

# Context & instructions
read: CONVENTIONS.md
map-tokens: 2048
