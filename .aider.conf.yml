model: gemini/gemini-pro-latest

# Fully autonomous execution
yes-always: true
auto-commits: true
auto-test: true
auto-lint: true

# Verification commands
test-cmd: npm test
lint-cmd: npm run build

# Language enforcement (English only)
commit-prompt: "Write a concise, imperative git commit message in English describing the changes. Do not use any other language."

# Context & instructions
read: CONVENTIONS.md