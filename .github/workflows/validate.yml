name: Validate

permissions:
  contents: read

on:
  push:
    branches: [main, refactor/canonical-state-and-trading-safety]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dead-code validation
        run: npm run validate:dead-code
      - name: Full dependency security audit
        run: npm run audit:dependencies
      - name: Audit production dependency surface
        run: npm run audit:production
