name: Validate

on:
  push:
    branches: [main, refactor/canonical-state-and-trading-safety]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dead-code diagnostics
        run: npm run validate:dead-code
        continue-on-error: true
