name: Validate

permissions:
  contents: read

on:
  push:
    branches: [main, refactor/canonical-state-and-trading-safety]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser smoke-test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.56.1-chromium
      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the production app in a browser
        run: node scripts/browser-smoke.mjs
      - name: Dead-code validation
        run: npm run validate:dead-code
      - name: Full dependency security audit
        run: npm run audit:dependencies
      - name: Audit production dependency surface
        run: npm run audit:production
