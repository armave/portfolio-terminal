name: Security & Workflow Validation

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Classify changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_codeql: ${{ steps.classify.outputs.run_codeql }}
      run_workflow_security: ${{ steps.classify.outputs.run_workflow_security }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify changed paths conservatively
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-change-detection.mjs

  workflow-security:
    name: Workflow lint and security analysis
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_workflow_security == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and verify actionlint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint -color .github/workflows/*.yml

      - name: Audit GitHub Actions workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows/
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium

  secret-scan:
    name: New-commit secret scan
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan only commits introduced by this PR or push
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
            scan_range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            scan_range="$PUSH_BEFORE_SHA..$GITHUB_SHA"
          else
            echo 'Could not establish a commit range for this event.' >&2
            exit 1
          fi
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --log-opts="$scan_range" --report-format json --report-path /repo/.gitleaks-report.json
          scan_status=$?
          set -e
          if [ -f .gitleaks-report.json ]; then
            echo "## Gitleaks new-commit finding metadata (secret values intentionally omitted)" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "- Rule: \(.RuleID); file: \(.File); line: \(.StartLine); commit: \(.Commit)"' .gitleaks-report.json | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f .gitleaks-report.json
          fi
          exit "$scan_status"

  historical-secret-audit:
    name: Full-history secret audit (advisory)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit full Git history with redacted output
        shell: bash
        run: |
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --log-opts='--all' --report-format json --report-path /repo/.gitleaks-report.json
          scan_status=$?
          set -e
          if [ -f .gitleaks-report.json ]; then
            echo "## Historical Gitleaks finding metadata (secret values intentionally omitted)" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "- Rule: \(.RuleID); file: \(.File); line: \(.StartLine); commit: \(.Commit)"' .gitleaks-report.json | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f .gitleaks-report.json
          fi
          exit "$scan_status"

  scheduled-dependency-audit:
    name: Scheduled npm dependency audit
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Audit all dependencies
        id: full_audit
        run: npm run audit:dependencies

      - name: Audit production dependencies
        id: production_audit
        run: npm run audit:production

      - name: Publish scheduled dependency audit evidence
        if: always()
        env:
          FULL_AUDIT_RESULT: ${{ steps.full_audit.outcome || 'not-run' }}
          PRODUCTION_AUDIT_RESULT: ${{ steps.production_audit.outcome || 'not-run' }}
        run: |
          {
            echo "## Scheduled dependency audit"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | $(git rev-parse HEAD) |"
            echo "| Full dependency audit | $FULL_AUDIT_RESULT |"
            echo "| Production dependency audit | $PRODUCTION_AUDIT_RESULT |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
          } >> "$GITHUB_STEP_SUMMARY"
  codeql:
    name: CodeQL JavaScript and TypeScript
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.run_codeql == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
