name: Security & Workflow Validation

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow lint and security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and verify actionlint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint -color .github/workflows/*.yml

      - name: Audit GitHub Actions workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows/
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history and working tree with Gitleaks
        shell: bash
        run: |
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git /repo --redact --exit-code 1 --report-format json --report-path /repo/.gitleaks-report.json
          scan_status=$?
          set -e
          if [ -f .gitleaks-report.json ]; then
            echo "## Gitleaks finding metadata (secret values intentionally omitted)" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "- Rule: \(.RuleID); file: \(.File); line: \(.StartLine); commit: \(.Commit)"' .gitleaks-report.json >> "$GITHUB_STEP_SUMMARY"
            rm -f .gitleaks-report.json
          fi
          exit "$scan_status"

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
