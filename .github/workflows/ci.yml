name: Pull Request CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      performance_baseline_runs:
        description: Samples per viewport for the browser performance baseline (use 10 for the extended PT-17 sample).
        required: false
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Static validation and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Lint JavaScript, TypeScript and JSX
        id: lint
        run: npm run lint

      - name: Validate release security-gate script syntax
        run: bash -n .github/scripts/require-main-push-security-success.sh

      - name: Run Vitest unit, Worker and V8 coverage suites
        id: tests
        run: npm run test:coverage

      - name: Upload coverage report from the single Vitest run
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Smoke-test Vite development server
        id: dev_server
        run: npm run test:dev-server

      - name: Validate dead code
        id: dead_code
        run: npm run validate:dead-code

      - name: Audit all dependencies
        id: dependency_audit
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        continue-on-error: true
        run: npm run audit:dependencies

      - name: Audit production dependencies
        id: production_audit
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        continue-on-error: true
        run: npm run audit:production

      - name: Enforce dependency audit results
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        env:
          FULL_AUDIT_RESULT: ${{ steps.dependency_audit.outcome || 'not-run' }}
          PRODUCTION_AUDIT_RESULT: ${{ steps.production_audit.outcome || 'not-run' }}
        run: |
          failed=0
          if [[ "$FULL_AUDIT_RESULT" != "success" ]]; then
            echo "::error::Full dependency audit did not pass (outcome: $FULL_AUDIT_RESULT)."
            failed=1
          fi
          if [[ "$PRODUCTION_AUDIT_RESULT" != "success" ]]; then
            echo "::error::Production dependency audit did not pass (outcome: $PRODUCTION_AUDIT_RESULT)."
            failed=1
          fi
          exit "$failed"

      - name: Publish exact-head quality evidence
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || 'not-applicable' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'not-applicable' }}
          DEPENDENCIES_RESULT: ${{ steps.install_dependencies.outcome || 'not-run' }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome || 'not-run' }}
          LINT_RESULT: ${{ steps.lint.outcome || 'not-run' }}
          TESTS_RESULT: ${{ steps.tests.outcome || 'not-run' }}
          DEV_SERVER_RESULT: ${{ steps.dev_server.outcome || 'not-run' }}
          DEAD_CODE_RESULT: ${{ steps.dead_code.outcome || 'not-run' }}
          DEPENDENCY_AUDIT_RESULT: ${{ steps.dependency_audit.outcome || 'not-run' }}
          PRODUCTION_AUDIT_RESULT: ${{ steps.production_audit.outcome || 'not-run' }}
        run: |
          TESTED_CHECKOUT_SHA="$(git rev-parse HEAD)"
          {
            echo "## Exact-head quality evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested checkout SHA | $TESTED_CHECKOUT_SHA |"
            echo "| PR head SHA | $PR_HEAD_SHA |"
            echo "| PR base SHA | $PR_BASE_SHA |"
            echo "| Ref | $GITHUB_REF |"
            echo "| Event | $GITHUB_EVENT_NAME |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "| Validation | Outcome |"
            echo "|---|---|"
            echo "| npm ci | $DEPENDENCIES_RESULT |"
            echo "| Typecheck | $TYPECHECK_RESULT |"
            echo "| Oxlint | $LINT_RESULT |"
            echo "| Vitest + V8 coverage | $TESTS_RESULT |"
            echo "| Vite development server smoke | $DEV_SERVER_RESULT |"
            echo "| Dead-code validation | $DEAD_CODE_RESULT |"
            echo "| Full dependency audit | $DEPENDENCY_AUDIT_RESULT |"
            echo "| Production dependency audit | $PRODUCTION_AUDIT_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

  production-build:
    name: Production build and artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        id: build
        run: npm run build

      - name: Write immutable build provenance into the artifact
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const provenance = {
              commit: process.env.BUILD_COMMIT,
              ref: process.env.BUILD_REF,
              runId: process.env.BUILD_RUN_ID,
              runAttempt: process.env.BUILD_RUN_ATTEMPT,
              event: process.env.BUILD_EVENT
            };
            writeFileSync("dist/build-provenance.json", JSON.stringify(provenance, null, 2) + "\n");
          '

      - name: Upload production build for browser journeys
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-terminal-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact-head build evidence
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome || 'not-run' }}
        run: |
          {
            echo "## Production build evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested checkout SHA | $(git rev-parse HEAD) |"
            echo "| Production build | $BUILD_RESULT |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
          } >> "$GITHUB_STEP_SUMMARY"

  browser-smoke:
    name: Production browser smoke and performance
    needs: production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portfolio-terminal-dist
          path: dist/

      - name: Install pinned Playwright runner
        run: npm run setup:browser-tests

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ubuntu-24.04-playwright-1.56.1-chromium

      - name: Install Chromium
        run: node node_modules/playwright/cli.js install chromium

      - name: Verify production PWA manifest, precache and offline shell
        run: npm run test:pwa

      - name: Smoke-test the production app and capture before/after UX screenshots
        id: browser_smoke
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            BEFORE_WORKTREE="$RUNNER_TEMP/ux-visual-before"
            mkdir -p artifacts/ux-visual-review/before artifacts/ux-visual-review/after
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            git worktree add --detach "$BEFORE_WORKTREE" "$PR_BASE_SHA"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$BEFORE_WORKTREE/node_modules"

            (
              cd "$BEFORE_WORKTREE"
              npm run build
              UX_EXPECT_NEW_HEADER=false \
                UX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/artifacts/ux-visual-review/before" \
                BROWSER_SMOKE_PORT=4173 \
                node "$GITHUB_WORKSPACE/scripts/browser-smoke.mjs"
            )

            UX_EXPECT_NEW_HEADER=true \
              UX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/artifacts/ux-visual-review/after" \
              BROWSER_SMOKE_PORT=4174 \
              node scripts/browser-smoke.mjs

            for stage in before after; do
              for surface in admin-combined admin-ticker guest-balance; do
                for viewport in mobile-390x844 tablet-768x1024 desktop-1440x900; do
                  test -s "artifacts/ux-visual-review/$stage/$surface-$viewport.png"
                done
              done
              for viewport in mobile-390x844 tablet-768x1024 desktop-1440x900; do
                test -s "artifacts/ux-visual-review/$stage/admin-exit-comparison-$viewport-inputs.png"
                test -s "artifacts/ux-visual-review/$stage/admin-exit-comparison-$viewport-results.png"
              done
            done

            AFTER_CHECKOUT_SHA="$(git rev-parse HEAD)"
            cat > artifacts/ux-visual-review/README.md <<EOF
          # Before/after UI visual review

          - Before commit: $PR_BASE_SHA
          - PR head commit: $PR_HEAD_SHA
          - After tested checkout (PR merge candidate): $AFTER_CHECKOUT_SHA
          - Fixture: deterministic synthetic administrator and guest accounts from scripts/browser-smoke.mjs.
          - Captured surfaces: administrator Combined Portfolio, administrator ticker, administrator Compare Exits modal (inputs and results), and guest Balance views.
          - Viewports: 390x844 (mobile), 768x1024 (tablet), 1440x900 (desktop).
          - These screenshots are mocked browser fixtures, not live broker or production-account evidence.
          - Compare matching filenames under before/ and after/.
          EOF

            git worktree remove --force "$BEFORE_WORKTREE"
          else
            node scripts/browser-smoke.mjs
          fi

      - name: Upload before/after UX visual review screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-visual-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: artifacts/ux-visual-review/
          if-no-files-found: warn
          retention-days: 30

      - name: Capture desktop and mobile browser performance baseline
        id: browser_performance
        env:
          PERFORMANCE_BASELINE_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_baseline_runs || 3 }}
          PERFORMANCE_BUILD_OUTPUT_PATH: dist
        run: node scripts/browser-performance-baseline.mjs

      - name: Upload browser performance baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-performance-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-performance-baseline.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish exact-head browser evidence
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || 'not-applicable' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'not-applicable' }}
          BROWSER_SMOKE_RESULT: ${{ steps.browser_smoke.outcome || 'not-run' }}
          PERFORMANCE_RESULT: ${{ steps.browser_performance.outcome || 'not-run' }}
        run: |
          {
            echo "## Exact-head browser evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested checkout SHA | $(git rev-parse HEAD) |"
            echo "| PR head SHA | $PR_HEAD_SHA |"
            echo "| PR base SHA | $PR_BASE_SHA |"
            echo "| Browser smoke and PR base/head screenshots | $BROWSER_SMOKE_RESULT |"
            echo "| Desktop/mobile performance baseline | $PERFORMANCE_RESULT |"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "| UX visual review artifact | ux-visual-review-${{ github.event.pull_request.number }}-$GITHUB_RUN_ID |"
              echo "| Screenshot coverage | Admin ticker, Compare Exits modal inputs/results, and guest Balance at 390x844, 768x1024, and 1440x900 (base and PR head) |"
            fi
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "The performance baseline is an unauthenticated app-shell fixture with mocked API responses; it does not certify authenticated live broker behavior."
          } >> "$GITHUB_STEP_SUMMARY"

  operations-browser:
    name: Operations Browser Journey
    needs: production-build
    permissions:
      contents: read
    uses: ./.github/workflows/operations-browser.yml
    with:
      artifact_name: portfolio-terminal-dist
      reuse_build_artifact: true
      performance_baseline_runs: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_baseline_runs || 3 }}

  coverage:
    name: Coverage baseline and thresholds
    needs: quality
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download coverage report from the quality job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vitest-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/

      - name: Recheck aggregate floors and publish measured coverage
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/coverage-summary.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const total = report.total;
          if (!total || typeof total !== 'object') throw new Error('Coverage summary has no aggregate total.');
          const floors = { lines: 80, statements: 80, functions: 85, branches: 70 };
          const rows = [];
          for (const [metric, floor] of Object.entries(floors)) {
            const measured = total[metric]?.pct;
            if (typeof measured !== 'number' || !Number.isFinite(measured)) {
              throw new Error('Coverage report is missing a valid ' + metric + ' percentage.');
            }
            rows.push({ metric, measured, floor });
            if (measured < floor) throw new Error(metric + ' coverage ' + measured + '% is below the ' + floor + '% floor.');
          }
          const markdown = [
            '## Financial, portfolio-store and Worker coverage',
            '',
            '| Metric | Measured | Required floor |',
            '|---|---:|---:|',
            ...rows.map(row => '| ' + row.metric + ' | ' + row.measured.toFixed(2) + '% | ' + row.floor + '% |'),
            '',
            'Generated by the single full Vitest execution in the quality job; this job consumes its exact artifact and does not rerun tests.'
          ].join('\n');
          process.stdout.write(markdown + '\n');
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown + '\n');
          NODE

      - name: Upload coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-coverage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: error
          retention-days: 30

  pages-stage:
    name: Validate and stage exact GitHub Pages artifact
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs:
      - quality
      - production-build
      - browser-smoke
      - operations-browser
      - coverage
    outputs:
      security_run_id: ${{ steps.require_security_success.outputs.security_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact source commit for release gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the production build artifact from this exact CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portfolio-terminal-dist
          path: dist/

      - name: Verify artifact provenance against this successful CI candidate
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const provenance = JSON.parse(readFileSync('dist/build-provenance.json', 'utf8'));
          const expected = {
            commit: process.env.EXPECTED_COMMIT,
            runId: process.env.EXPECTED_RUN_ID,
            event: process.env.EXPECTED_EVENT,
            ref: process.env.EXPECTED_REF
          };
          for (const [field, value] of Object.entries(expected)) {
            if (provenance[field] !== value) {
              throw new Error('Production artifact provenance mismatch for ' + field + '.');
            }
          }
          console.log('Validated production artifact for ' + provenance.commit + ' from CI run ' + provenance.runId + '.');
          NODE

      - name: Require successful security validation for this exact main commit
        id: require_security_success
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: bash .github/scripts/require-main-push-security-success.sh

      - name: Upload the validated Pages artifact for this workflow run
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/

  pages-deploy:
    name: Deploy validated GitHub Pages artifact
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs:
      - pages-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staged Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verify published site responds
        id: verify_published_site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --location --silent --show-error \
            --retry 8 --retry-delay 5 --retry-connrefused --max-time 20 \
            "$PAGE_URL" --output "$RUNNER_TEMP/pages-index.html"
          grep -qi "Portfolio Terminal" "$RUNNER_TEMP/pages-index.html"

      - name: Publish exact-artifact deployment evidence
        if: always()
        env:
          DEPLOYED_COMMIT: ${{ github.sha }}
          DEPLOYED_RUN_ID: ${{ github.run_id }}
          SECURITY_RUN_ID: ${{ needs.pages-stage.outputs.security_run_id || 'not-verified' }}
          DEPLOY_RESULT: ${{ steps.deployment.outcome || 'not-run' }}
          VERIFY_RESULT: ${{ steps.verify_published_site.outcome || 'not-run' }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url || 'not-published' }}
        run: |
          {
            echo "## GitHub Pages exact-artifact deployment"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source commit | $DEPLOYED_COMMIT |"
            echo "| Source CI run | $DEPLOYED_RUN_ID |"
            echo "| Same-commit security run | $SECURITY_RUN_ID |"
            echo "| Deployment | $DEPLOY_RESULT |"
            echo "| Published-site verification | $VERIFY_RESULT |"
            echo "| URL | $DEPLOYED_URL |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
          } >> "$GITHUB_STEP_SUMMARY"
