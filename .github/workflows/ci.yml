name: Pull Request CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      performance_baseline_runs:
        description: Samples per viewport for the browser performance baseline (use 10 for the extended PT-17 sample).
        required: false
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static validation and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Lint JavaScript, TypeScript and JSX
        id: lint
        run: npm run lint

      - name: Run Vitest unit and Worker suites
        id: tests
        run: npm test

      - name: Smoke-test Vite development server
        id: dev_server
        run: npm run test:dev-server

      - name: Validate dead code
        id: dead_code
        run: npm run validate:dead-code

      - name: Audit all dependencies
        id: dependency_audit
        run: npm run audit:dependencies

      - name: Audit production dependencies
        id: production_audit
        run: npm run audit:production

      - name: Publish exact-head quality evidence
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || 'not-applicable' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'not-applicable' }}
          DEPENDENCIES_RESULT: ${{ steps.install_dependencies.outcome || 'not-run' }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome || 'not-run' }}
          LINT_RESULT: ${{ steps.lint.outcome || 'not-run' }}
          TESTS_RESULT: ${{ steps.tests.outcome || 'not-run' }}
          DEV_SERVER_RESULT: ${{ steps.dev_server.outcome || 'not-run' }}
          DEAD_CODE_RESULT: ${{ steps.dead_code.outcome || 'not-run' }}
          DEPENDENCY_AUDIT_RESULT: ${{ steps.dependency_audit.outcome || 'not-run' }}
          PRODUCTION_AUDIT_RESULT: ${{ steps.production_audit.outcome || 'not-run' }}
        run: |
          TESTED_CHECKOUT_SHA="$(git rev-parse HEAD)"
          {
            echo "## Exact-head quality evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested checkout SHA | $TESTED_CHECKOUT_SHA |"
            echo "| PR head SHA | $PR_HEAD_SHA |"
            echo "| PR base SHA | $PR_BASE_SHA |"
            echo "| Ref | $GITHUB_REF |"
            echo "| Event | $GITHUB_EVENT_NAME |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "| Validation | Outcome |"
            echo "|---|---|"
            echo "| npm ci | $DEPENDENCIES_RESULT |"
            echo "| Typecheck | $TYPECHECK_RESULT |"
            echo "| Oxlint | $LINT_RESULT |"
            echo "| Vitest | $TESTS_RESULT |"
            echo "| Vite development server smoke | $DEV_SERVER_RESULT |"
            echo "| Dead-code validation | $DEAD_CODE_RESULT |"
            echo "| Full dependency audit | $DEPENDENCY_AUDIT_RESULT |"
            echo "| Production dependency audit | $PRODUCTION_AUDIT_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

  production-build:
    name: Production build and artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        id: build
        run: npm run build

      - name: Upload production build for browser journeys
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-terminal-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact-head build evidence
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome || 'not-run' }}
        run: |
          {
            echo "## Production build evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested checkout SHA | $(git rev-parse HEAD) |"
            echo "| Production build | $BUILD_RESULT |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
          } >> "$GITHUB_STEP_SUMMARY"

  browser-smoke:
    name: Production browser smoke and performance
    needs: production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portfolio-terminal-dist
          path: dist/

      - name: Install pinned Playwright runner
        run: npm run setup:browser-tests

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ubuntu-24.04-playwright-1.56.1-chromium

      - name: Install Chromium
        run: node node_modules/playwright/cli.js install chromium

      - name: Smoke-test the production app and capture before/after UX screenshots
        id: browser_smoke
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            BEFORE_WORKTREE="$RUNNER_TEMP/ux-visual-before"
            mkdir -p artifacts/ux-visual-review/before artifacts/ux-visual-review/after
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            git worktree add --detach "$BEFORE_WORKTREE" "$PR_BASE_SHA"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$BEFORE_WORKTREE/node_modules"

            (
              cd "$BEFORE_WORKTREE"
              npm run build
              UX_EXPECT_NEW_HEADER=false \
                UX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/artifacts/ux-visual-review/before" \
                BROWSER_SMOKE_PORT=4173 \
                node "$GITHUB_WORKSPACE/scripts/browser-smoke.mjs"
            )

            UX_EXPECT_NEW_HEADER=true \
              UX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/artifacts/ux-visual-review/after" \
              BROWSER_SMOKE_PORT=4174 \
              node scripts/browser-smoke.mjs

            for stage in before after; do
              for surface in admin-combined admin-ticker guest-balance; do
                for viewport in mobile-390x844 tablet-768x1024 desktop-1440x900; do
                  test -s "artifacts/ux-visual-review/$stage/$surface-$viewport.png"
                done
              done
            done

            AFTER_CHECKOUT_SHA="$(git rev-parse HEAD)"
            cat > artifacts/ux-visual-review/README.md <<EOF
          # Before/after UI visual review

          - Before commit: $PR_BASE_SHA
          - PR head commit: $PR_HEAD_SHA
          - After tested checkout (PR merge candidate): $AFTER_CHECKOUT_SHA
          - Fixture: deterministic synthetic administrator and guest accounts from scripts/browser-smoke.mjs.
          - Captured surfaces: administrator Combined Portfolio, administrator ticker, and guest Balance views.
          - Viewports: 390x844 (mobile), 768x1024 (tablet), 1440x900 (desktop).
          - These screenshots are mocked browser fixtures, not live broker or production-account evidence.
          - Compare matching filenames under before/ and after/.
          EOF

            git worktree remove --force "$BEFORE_WORKTREE"
          else
            node scripts/browser-smoke.mjs
          fi

      - name: Upload before/after UX visual review screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-visual-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: artifacts/ux-visual-review/
          if-no-files-found: warn
          retention-days: 30

      - name: Capture desktop and mobile browser performance baseline
        id: browser_performance
        env:
          PERFORMANCE_BASELINE_RUNS: ${{ inputs.performance_baseline_runs || 3 }}
        run: node scripts/browser-performance-baseline.mjs

      - name: Upload browser performance baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-performance-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-performance-baseline.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish exact-head browser evidence
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || 'not-applicable' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'not-applicable' }}
          BROWSER_SMOKE_RESULT: ${{ steps.browser_smoke.outcome || 'not-run' }}
          PERFORMANCE_RESULT: ${{ steps.browser_performance.outcome || 'not-run' }}
        run: |
          {
            echo "## Exact-head browser evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested checkout SHA | $(git rev-parse HEAD) |"
            echo "| PR head SHA | $PR_HEAD_SHA |"
            echo "| PR base SHA | $PR_BASE_SHA |"
            echo "| Browser smoke and PR base/head screenshots | $BROWSER_SMOKE_RESULT |"
            echo "| Desktop/mobile performance baseline | $PERFORMANCE_RESULT |"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "| UX visual review artifact | ux-visual-review-${{ github.event.pull_request.number }}-$GITHUB_RUN_ID |"
              echo "| Screenshot coverage | Admin ticker + guest Balance at 390x844, 768x1024, and 1440x900 (base and PR head) |"
            fi
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "The performance baseline is an unauthenticated app-shell fixture with mocked API responses; it does not certify authenticated live broker behavior."
          } >> "$GITHUB_STEP_SUMMARY"

  operations-browser:
    name: Operations Browser Journey
    needs: production-build
    permissions:
      contents: read
    uses: ./.github/workflows/operations-browser.yml
    with:
      artifact_name: portfolio-terminal-dist
      reuse_build_artifact: true

  coverage:
    name: Coverage baseline and thresholds
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Run Vitest with V8 coverage
        id: coverage
        run: npm run test:coverage

      - name: Upload financial-domain and Worker coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 30
