name: Temporary dependency lock refresh

on:
  push:
    branches:
      - chore/dependency-security-hardening-2026-11-02

permissions:
  contents: write

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate npm lockfile for audited overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit the regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "chore(deps): refresh lockfile for security overrides"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Install the exact lockfile
        run: npm ci
      - name: Confirm resolved security-sensitive versions
        run: npm ls glob minimatch @trickfilm400/rollup-plugin-off-main-thread ejs deepmerge --all
      - name: TypeScript validation
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser smoke-test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production Chromium smoke
        run: node scripts/browser-smoke.mjs
      - name: Dead-code validation
        run: npm run validate:dead-code
      - name: Full dependency audit
        run: npm run audit:dependencies
      - name: Production dependency audit
        run: npm run audit:production
      - name: Report remaining advisory metadata
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"
