name: Financial Integrity Regression

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'src/domain/**'
      - 'src/store/**'
      - 'src/services/backupImport.ts'
      - 'src/services/storage.ts'
      - 'src/services/cloudSnapshotReconciliation.ts'
      - 'src/services/cloudStateSecurity.ts'
      - 'src/services/cloudStateSyncRuntime.ts'
      - 'src/services/freedomTradeNet.ts'
      - 'src/services/portfolioBrokerDataRuntime.ts'
      - 'src/services/freedomMarketDepth.js'
      - 'src/services/brokerAdapters/**'
      - 'src/services/freedom-trades.ts'
      - 'src/services/freedom-balance.ts'
      - 'src/types/portfolio.ts'
      - 'src/types/portfolioTransaction.ts'
      - 'worker.js'
      - 'state-store.js'
      - 'worker.test.js'
      - 'user-auth.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/financial-regression.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'src/domain/**'
      - 'src/store/**'
      - 'src/services/backupImport.ts'
      - 'src/services/storage.ts'
      - 'src/services/cloudSnapshotReconciliation.ts'
      - 'src/services/cloudStateSecurity.ts'
      - 'src/services/cloudStateSyncRuntime.ts'
      - 'src/services/freedomTradeNet.ts'
      - 'src/services/portfolioBrokerDataRuntime.ts'
      - 'src/services/freedomMarketDepth.js'
      - 'src/services/brokerAdapters/**'
      - 'src/services/freedom-trades.ts'
      - 'src/services/freedom-balance.ts'
      - 'src/types/portfolio.ts'
      - 'src/types/portfolioTransaction.ts'
      - 'worker.js'
      - 'state-store.js'
      - 'worker.test.js'
      - 'user-auth.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/financial-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-integrity:
    name: Transactions, persistence and authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Run focused financial and transaction regressions
        id: tests
        run: npm run test:financial

      - name: Publish exact-head financial regression evidence
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome || 'not-run' }}
        run: |
          {
            echo "## Financial integrity regression evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested checkout SHA | $(git rev-parse HEAD) |"
            echo "| Financial regression suite | $TEST_RESULT |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "This workflow uses deterministic fixtures. It does not certify live broker connectivity or place trades."
          } >> "$GITHUB_STEP_SUMMARY"
