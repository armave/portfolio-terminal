name: Financial Integrity Regression

# The full PR/push quality suite already executes every test in test:financial.
# Keep this focused subset available for a manually requested diagnostic run,
# but do not pay for a second installation and duplicate test execution per commit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-integrity:
    name: Transactions, persistence and authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Run focused financial and transaction regressions
        id: tests
        run: npm run test:financial

      - name: Publish exact-head financial regression evidence
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome || 'not-run' }}
        run: |
          {
            echo "## Financial integrity regression evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested checkout SHA | $(git rev-parse HEAD) |"
            echo "| Financial regression suite | $TEST_RESULT |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "This workflow uses deterministic fixtures. It does not certify live broker connectivity or place trades."
          } >> "$GITHUB_STEP_SUMMARY"
