name: Operations Browser Journey

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the production build artifact produced by Pull Request CI.
        required: false
        type: string
        default: portfolio-terminal-dist
      reuse_build_artifact:
        description: Reuse the caller workflow's production build instead of building again.
        required: false
        type: boolean
        default: true
      performance_baseline_runs:
        description: Authenticated synthetic-portfolio performance samples per viewport.
        required: false
        type: number
        default: 3
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Build artifact name when reusing an existing workflow artifact.
        required: false
        type: string
        default: portfolio-terminal-dist
      reuse_build_artifact:
        description: Reuse an existing workflow artifact; otherwise build locally in this run.
        required: false
        type: boolean
        default: false
      performance_baseline_runs:
        description: Authenticated synthetic-portfolio performance samples per viewport (manual runs default to 10).
        required: false
        type: number
        default: 10

permissions:
  contents: read

jobs:
  operations-browser:
    name: Account, Settings and guest browser journey
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Build production site for standalone manual runs
        if: ${{ !inputs.reuse_build_artifact }}
        id: build
        run: npm run build

      - name: Download caller production build
        if: ${{ inputs.reuse_build_artifact }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/

      - name: Install isolated browser runner
        id: install_playwright
        run: npm run setup:browser-tests

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ubuntu-24.04-playwright-1.56.1-chromium

      - name: Install Chromium
        id: install_chromium
        run: node node_modules/playwright/cli.js install chromium

      - name: Exercise account and Settings journeys in production browser
        id: operations_browser
        env:
          AUTHENTICATED_PERFORMANCE_BASELINE_RUNS: ${{ inputs.performance_baseline_runs }}
        run: node scripts/browser-smoke-operations.mjs

      - name: Upload authenticated synthetic-portfolio performance baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authenticated-portfolio-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/authenticated-portfolio-performance.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish exact-head operations evidence
        if: always()
        env:
          DEPENDENCIES_RESULT: ${{ steps.install_dependencies.outcome || 'not-run' }}
          BUILD_RESULT: ${{ steps.build.outcome || 'not-run' }}
          PLAYWRIGHT_RESULT: ${{ steps.install_playwright.outcome || 'not-run' }}
          CHROMIUM_RESULT: ${{ steps.install_chromium.outcome || 'not-run' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || 'not-applicable' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'not-applicable' }}
          BROWSER_RESULT: ${{ steps.operations_browser.outcome || 'not-run' }}
        run: |
          TESTED_CHECKOUT_SHA="$(git rev-parse HEAD)"
          {
            echo "## Exact-head operations browser evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested checkout SHA | $TESTED_CHECKOUT_SHA |"
            echo "| PR head SHA | $PR_HEAD_SHA |"
            echo "| PR base SHA | $PR_BASE_SHA |"
            echo "| Ref | $GITHUB_REF |"
            echo "| Event | $GITHUB_EVENT_NAME |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "| Validation | Outcome |"
            echo "|---|---|"
            echo "| npm ci | $DEPENDENCIES_RESULT |"
            echo "| Standalone production build | $BUILD_RESULT |"
            echo "| Playwright install | $PLAYWRIGHT_RESULT |"
            echo "| Chromium install | $CHROMIUM_RESULT |"
            echo "| Operations browser journey | $BROWSER_RESULT |"
            echo
            echo "The Worker and broker interactions in this browser journey use deterministic fixtures; live authenticated broker verification remains a separate manual gate."
          } >> "$GITHUB_STEP_SUMMARY"
