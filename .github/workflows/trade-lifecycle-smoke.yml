name: Trade Lifecycle Browser Smoke

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'app.ts'
      - 'src/features/terminal/commandDispatcher.ts'
      - 'src/features/terminal/commandDispatcher.test.ts'
      - 'src/features/terminal/commandDispatcher.tradePreview.test.ts'
      - 'src/features/terminal/commandExecutionGuard.ts'
      - 'src/features/terminal/commandExecutionGuard.test.ts'
      - 'src/store/portfolioStore.ts'
      - 'src/store/portfolioTradeBoundary.test.ts'
      - 'src/services/i18n.ts'
      - 'src/services/i18n-ru.ts'
      - 'scripts/browser-smoke-trades.mjs'
      - '.github/workflows/trade-lifecycle-smoke.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'app.ts'
      - 'src/features/terminal/commandDispatcher.ts'
      - 'src/features/terminal/commandDispatcher.test.ts'
      - 'src/features/terminal/commandDispatcher.tradePreview.test.ts'
      - 'src/features/terminal/commandExecutionGuard.ts'
      - 'src/features/terminal/commandExecutionGuard.test.ts'
      - 'src/store/portfolioStore.ts'
      - 'src/store/portfolioTradeBoundary.test.ts'
      - 'src/services/i18n.ts'
      - 'src/services/i18n-ru.ts'
      - 'scripts/browser-smoke-trades.mjs'
      - '.github/workflows/trade-lifecycle-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-lifecycle-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trade-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Run trade lifecycle unit tests
        id: trade_unit_tests
        run: npx vitest run src/features/terminal/commandDispatcher.test.ts src/features/terminal/commandDispatcher.tradePreview.test.ts src/features/terminal/commandExecutionGuard.test.ts src/store/portfolioTradeBoundary.test.ts src/store/portfolioStore.test.ts

      - name: Build production site
        id: build
        run: npm run build

      - name: Install browser smoke-test runner
        id: install_playwright
        run: PLAYWRIGHT_ROOT="$RUNNER_TEMP/portfolio-terminal-playwright"
mkdir -p "$PLAYWRIGHT_ROOT"
npm install --prefix "$PLAYWRIGHT_ROOT" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
ln -s "$PLAYWRIGHT_ROOT/node_modules/playwright" node_modules/playwright
ln -s "$PLAYWRIGHT_ROOT/node_modules/.bin/playwright" node_modules/.bin/playwright

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.56.1-chromium

      - name: Install Chromium for trade lifecycle journey
        id: install_chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise the production trade lifecycle
        id: trade_browser_smoke
        run: node scripts/browser-smoke-trades.mjs

      - name: Publish exact-head trade lifecycle evidence
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || 'not-applicable' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'not-applicable' }}
          DEPENDENCIES_RESULT: ${{ steps.install_dependencies.outcome || 'not-run' }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome || 'not-run' }}
          UNIT_TESTS_RESULT: ${{ steps.trade_unit_tests.outcome || 'not-run' }}
          BUILD_RESULT: ${{ steps.build.outcome || 'not-run' }}
          PLAYWRIGHT_RESULT: ${{ steps.install_playwright.outcome || 'not-run' }}
          CHROMIUM_RESULT: ${{ steps.install_chromium.outcome || 'not-run' }}
          BROWSER_RESULT: ${{ steps.trade_browser_smoke.outcome || 'not-run' }}
        run: |
          TESTED_CHECKOUT_SHA="$(git rev-parse HEAD)"
          {
            echo "## Exact-head trade lifecycle evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested checkout SHA | $TESTED_CHECKOUT_SHA |"
            echo "| PR head SHA | $PR_HEAD_SHA |"
            echo "| PR base SHA | $PR_BASE_SHA |"
            echo "| Ref | $GITHUB_REF |"
            echo "| Event | $GITHUB_EVENT_NAME |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "| Validation | Outcome |"
            echo "|---|---|"
            echo "| npm ci | $DEPENDENCIES_RESULT |"
            echo "| Typecheck | $TYPECHECK_RESULT |"
            echo "| Trade lifecycle Vitest | $UNIT_TESTS_RESULT |"
            echo "| Production build | $BUILD_RESULT |"
            echo "| Playwright install | $PLAYWRIGHT_RESULT |"
            echo "| Chromium install | $CHROMIUM_RESULT |"
            echo "| Production trade lifecycle browser journey | $BROWSER_RESULT |"
            echo
            echo "This journey uses deterministic mocked broker/Worker responses; it is not authenticated production TradeNet verification."
          } >> "$GITHUB_STEP_SUMMARY"
