name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'src/services/freedomTradeNet.ts'
      - 'state-store.js'
      - 'tenant-key-service.js'
      - 'src/services/freedomMarketDepth.js'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  validate-production-ref:
    name: Validate production deployment target
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Reject deployments from non-production refs
        env:
          DEPLOYMENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_REF" != "refs/heads/main" ]]; then
            echo "::error::Cloudflare Worker deployment is restricted to refs/heads/main (received $DEPLOYMENT_REF)."
            exit 1
          fi

  deploy:
    name: Validate and deploy Worker
    needs: validate-production-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    environment:
      name: cloudflare-production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Worker and application TypeScript
        run: npm run typecheck

      - name: Validate Worker and authentication tests
        run: npx vitest run worker.test.js user-auth.test.js tenant-key-service.test.js

      - name: Audit all dependencies
        run: npm run audit:dependencies

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Validate Worker bundle and Wrangler configuration
        id: worker_dry_run
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          command: deploy --var DEPLOYMENT_SHA:${{ github.sha }} --dry-run

      - name: Require successful security validation for this exact main commit
        id: require_security_success
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: bash .github/scripts/require-main-push-security-success.sh

      - name: Deploy Worker with pinned Wrangler
        id: deploy_worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          command: deploy --var DEPLOYMENT_SHA:${{ github.sha }}

      - name: Verify deployed Worker health and exact commit
        id: verify_worker
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 5 --retry-connrefused --max-time 15 \
            "https://trading-proxy.armenavetisyan-sa.workers.dev/health")"
          jq -e --arg sha "$EXPECTED_SHA" '
            .ok == true and
            .service == "trading-proxy" and
            .deploymentSha == $sha
          ' <<< "$response" > /dev/null
          echo "$response" | jq '{ok, service, deploymentSha}'

      - name: Publish exact-ref deployment evidence
        if: always()
        env:
          DRY_RUN_RESULT: ${{ steps.worker_dry_run.outcome || 'not-run' }}
          SECURITY_RUN_ID: ${{ steps.require_security_success.outputs.security_run_id || 'not-verified' }}
          DEPLOY_RESULT: ${{ steps.deploy_worker.outcome || 'not-run' }}
          VERIFY_RESULT: ${{ steps.verify_worker.outcome || 'not-run' }}
        run: |
          {
            echo "## Cloudflare Worker deployment evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Deployed commit candidate | $(git rev-parse HEAD) |"
            echo "| Ref | $GITHUB_REF |"
            echo "| Dry-run validation | $DRY_RUN_RESULT |"
            echo "| Same-commit security run | $SECURITY_RUN_ID |"
            echo "| Deployment | $DEPLOY_RESULT |"
            echo "| Post-deployment health/version verification | $VERIFY_RESULT |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
          } >> "$GITHUB_STEP_SUMMARY"
