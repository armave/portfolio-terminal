name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows:
      - Pull Request CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Pull Request CI run on main whose exact artifact should be published.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish GitHub Pages
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve and validate the successful main CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::A numeric source CI run ID is required."
            exit 1
          fi
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .name == "Pull Request CI" and
            .head_branch == "main" and
            .head_repository.full_name == $repository and
            .status == "completed" and
            .conclusion == "success" and
            (.event == "push" or .event == "workflow_dispatch")
          ' <<< "$run_json" > /dev/null
          {
            echo "run_id=$(jq -r '.id' <<< "$run_json")"
            echo "commit=$(jq -r '.head_sha' <<< "$run_json")"
            echo "event=$(jq -r '.event' <<< "$run_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Download production artifact from that exact CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portfolio-terminal-dist
          path: dist/
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Verify artifact provenance matches the successful main CI run
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          EXPECTED_RUN_ID: ${{ steps.source.outputs.run_id }}
          EXPECTED_EVENT: ${{ steps.source.outputs.event }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const provenance = JSON.parse(readFileSync('dist/build-provenance.json', 'utf8'));
          const expected = {
            commit: process.env.EXPECTED_COMMIT,
            runId: process.env.EXPECTED_RUN_ID,
            ref: 'refs/heads/main',
            event: process.env.EXPECTED_EVENT
          };
          for (const [field, value] of Object.entries(expected)) {
            if (provenance[field] !== value) {
              throw new Error('Production artifact provenance mismatch for ' + field + '.');
            }
          }
          console.log('Validated production artifact for ' + provenance.commit + ' from CI run ' + provenance.runId + '.');
          NODE

      - name: Upload the exact validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/

      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify published site responds
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --location --silent --show-error \
            --retry 8 --retry-delay 5 --retry-connrefused --max-time 20 \
            "$PAGE_URL" --output "$RUNNER_TEMP/pages-index.html"
          grep -qi "Portfolio Terminal" "$RUNNER_TEMP/pages-index.html"

      - name: Publish exact-artifact deployment evidence
        if: always()
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id || 'not-validated' }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit || 'not-validated' }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url || 'not-published' }}
          DEPLOY_RESULT: ${{ steps.deployment.outcome || 'not-run' }}
          VERIFY_RESULT: ${{ steps.verify_published_site.outcome || 'not-run' }}
        run: |
          {
            echo "## GitHub Pages exact-artifact deployment"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source CI run | $SOURCE_RUN_ID |"
            echo "| Source commit | $SOURCE_COMMIT |"
            echo "| Deployment | $DEPLOY_RESULT |"
            echo "| Published-site verification | $VERIFY_RESULT |"
            echo "| URL | $DEPLOYED_URL |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
          } >> "$GITHUB_STEP_SUMMARY"
