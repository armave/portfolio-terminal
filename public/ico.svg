<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Terminal Display Frame -->
  <rect x="76" y="96" width="360" height="260" rx="24" fill="#030b17" stroke="#1e293b" stroke-width="6" />
  
  <!-- Terminal Header Dots -->
  <circle cx="112" cy="126" r="6" fill="#f43f5e" />
  <circle cx="132" cy="126" r="6" fill="#fbbf24" />
  <circle cx="152" cy="126" r="6" fill="#34d399" />

  <!-- Candlestick 1 (Cyan Up) -->
  <line x1="160" y1="170" x2="160" y2="300" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
  <rect x="148" y="200" width="24" height="70" rx="4" fill="url(#cyanGlow)" />

  <!-- Candlestick 2 (Red Down) -->
  <line x1="225" y1="180" x2="225" y2="310" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />
  <rect x="213" y="210" width="24" height="65" rx="4" fill="#f43f5e" opacity="0.9" />

  <!-- Candlestick 3 (Emerald Up) -->
  <line x1="290" y1="150" x2="290" y2="290" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <rect x="278" y="175" width="24" height="85" rx="4" fill="url(#emeraldGlow)" />

  <!-- Candlestick 4 (Breakout Bull) -->
  <line x1="355" y1="135" x2="355" y2="270" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  <rect x="343" y="150" width="24" height="75" rx="4" fill="url(#emeraldGlow)" filter="url(#neonBlur)" />

  <!-- Terminal Stand -->
  <path d="M 226 356 L 216 410 L 296 410 L 286 356 Z" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
  <rect x="186" y="408" width="140" height="14" rx="7" fill="#1e293b" />
</svg>
