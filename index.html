<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>Margin Portfolio Terminal — Tradernet Armenia Edition</title>
  <link rel="icon" type="image/svg+xml" href="ico.svg" />
  <!-- STARTUP_CRITICAL_CSS -->
</head>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-900 selection:text-cyan-100">
  <div id="startup-loading" class="startup-loading" role="status" aria-live="polite">
    <div class="startup-loading__content">
      <div class="startup-loading__mark" aria-hidden="true">PT</div>
      <div class="startup-loading__title">PORTFOLIO TERMINAL</div>
      <div class="startup-loading__message">Initializing your portfolio…</div>
      <div class="startup-loading__track" aria-hidden="true"><span></span></div>
      <div class="startup-loading__hint">Restoring saved data and market connections</div>
      <div class="startup-loading__actions" hidden>
        <button id="startup-retry" type="button">Retry</button>
        <button id="startup-continue-offline" type="button">Continue offline</button>
      </div>
    </div>
  </div>
  <div id="auth-container" style="display: none" class="auth-overlay"></div>
  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <div id="root" class="max-w-6xl mx-auto pt-10"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
