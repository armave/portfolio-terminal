<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>Margin Portfolio Terminal — Tradernet Armenia Edition</title>
  <link rel="icon" type="image/svg+xml" href="ico.svg" />
  <style>
    /* Critical startup styles: apply before the bundled stylesheet loads. */
    html, body {
      min-height: 100%;
      margin: 0;
      background: #090c13;
      color: #e2e8f0;
    }
    .startup-loading {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: radial-gradient(circle at 50% 38%, rgba(34, 211, 238, 0.09), transparent 22rem), #090c13;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 1;
      visibility: visible;
      transition: opacity 220ms ease, visibility 220ms ease;
    }
    .startup-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .startup-loading__content {
      width: min(100%, 360px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .startup-loading__mark {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin-bottom: 22px;
      border: 1px solid rgba(34, 211, 238, 0.55);
      border-radius: 14px;
      color: #67e8f9;
      background: rgba(8, 47, 73, 0.4);
      box-shadow: 0 0 36px rgba(34, 211, 238, 0.12);
      font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: -0.08em;
    }
    .startup-loading__title {
      color: #e2e8f0;
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.18em;
    }
    .startup-loading__message {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 13px;
    }
    .startup-loading__track {
      width: min(100%, 240px);
      height: 3px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 999px;
      background: #1e293b;
    }
    .startup-loading__track span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: #22d3ee;
      animation: startup-loading-progress 1.25s ease-in-out infinite;
    }
    .startup-loading__hint {
      margin-top: 12px;
      color: #64748b;
      font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    @keyframes startup-loading-progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(360%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .startup-loading, .startup-loading__track span {
        transition: none;
        animation: none;
      }
      .startup-loading__track span { width: 100%; }
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-900 selection:text-cyan-100">
  <div id="startup-loading" class="startup-loading" role="status" aria-live="polite">
    <div class="startup-loading__content">
      <div class="startup-loading__mark" aria-hidden="true">PT</div>
      <div class="startup-loading__title">PORTFOLIO TERMINAL</div>
      <div class="startup-loading__message">Initializing your portfolio…</div>
      <div class="startup-loading__track" aria-hidden="true"><span></span></div>
      <div class="startup-loading__hint">Restoring saved data and market connections</div>
    </div>
  </div>
  <div id="auth-container" style="display: none" class="auth-overlay"></div>
  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <div id="root" class="max-w-6xl mx-auto"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
